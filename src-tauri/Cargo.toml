[package]
name = "standin-desktop"
version = "0.1.1-beta.2"
description = "Standin Desktop"
edition = "2021"

[lib]
name = "standin_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.9.7"
base64 = "0.22"
tokio = { version = "1", features = ["sync"] }
# refresh token을 OS 키체인에 보관(ADR-002). 기본 feature가 Windows Credential Manager와
# macOS Keychain 백엔드를 켠다.
keyring = "4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# 저장된 포즈 파일을 앱에서 클립스튜디오로 바로 끌어놓기 위한 네이티브 드래그(ADR-009).
# 데스크톱 전용이라 모바일 타깃에서는 제외한다.
tauri-plugin-drag = "2"
# 자동 업데이트(ADR-011). 릴리스 빌드만 실제 피드를 갖고, dev·mock 빌드는
# endpoints가 비어 있어 확인 자체를 하지 않는다.
tauri-plugin-updater = "2"
# 업데이트 설치 후 재시작에만 쓴다. capability는 allow-restart 하나만 연다.
tauri-plugin-process = "2"

# 화면 기록 권한(TCC) 확인용. xcap이 쓰는 CGWindowListCreateImage는 권한이 없어도
# 실패하지 않고 바탕화면만 담긴 이미지를 돌려주므로, 캡처 전에 직접 물어봐야 한다.
# xcap이 이미 같은 crate를 끌어오므로 빌드에 새로 추가되는 비용은 없다.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGWindow"] }
