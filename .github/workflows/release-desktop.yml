name: Build desktop release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: "Publish as a draft release (verify signatures before it goes public)"
        type: boolean
        default: true
      environment:
        description: "어느 백엔드를 보는 빌드인가"
        type: choice
        options: [production, staging]
        default: production

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            rustTargets: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis

          - platform: macos-latest
            target: universal-apple-darwin
            rustTargets: aarch64-apple-darwin,x86_64-apple-darwin
            # `app` is listed alongside `dmg` because the macOS updater asset
            # (.app.tar.gz) is produced from the .app bundle, not from the dmg.
            # With dmg alone the auto-update entry for macOS goes missing silently.
            args: --target universal-apple-darwin --bundles app,dmg

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # 환경마다 나갈 수 있는 브랜치를 고정한다. 가드를 푸는 것이 아니라 staging용
      # 짝을 만드는 것이다 — 프로덕션은 여전히 main에서만 나간다.
      - name: Require the branch that matches the environment
        shell: bash
        env:
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          if [ "$TARGET_ENV" = "staging" ]; then
            if [ "$GITHUB_REF" != "refs/heads/develop" ]; then
              echo "staging builds must run from the develop branch."
              exit 1
            fi
          elif [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Desktop releases must run from the main branch."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      # beta.4에서 공증 자격을 맞추느라 이 워크플로를 네 번 돌렸다. 캐시가 없어
      # 매번 의존성 전체를 아키텍처 두 개에 대해 다시 컴파일했고, 실패한 시도마다
      # 빌드에만 10분이 들었다.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Read release version
        id: release
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          node scripts/set-version.mjs "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        run: node scripts/release-notes.mjs --github-output

      - name: Refuse to replace a published version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.release.outputs.version }}
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          if [ "$TARGET_ENV" = staging ]; then TAG="$TAG-staging"; fi
          EXISTING="$(gh release list --limit 1000 --json tagName,isDraft)"
          TAG="$TAG" RELEASES="$EXISTING" node -e '
            const release = JSON.parse(process.env.RELEASES).find(r => r.tagName === process.env.TAG);
            if (release && !release.isDraft) throw new Error("Published version already exists; bump the version.");
          '

      # Updater artifacts are signed with a minisign keypair, which is separate from
      # OS code signing (ADR-011). The public key lives in tauri.conf.json; the private
      # key is a secret. Build without updater assets while the pair is missing.
      - name: Resolve updater signing
        id: updater
        shell: bash
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          # staging 빌드는 자동 업데이트를 켜지 않는다. 켜면 latest.json을 보고
          # **스스로 프로덕션 빌드로 갈아타** 검증하던 환경이 사라진다.
          # tauri.staging.conf.json이 endpoints를 비우고, 여기서 서명 자산도 만들지 않는다.
          if [ "${{ inputs.environment }}" = "staging" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "extraArgs=--config src-tauri/tauri.staging.conf.json" >> "$GITHUB_OUTPUT"
            echo "staging build: updater disabled, separate app identifier."
            exit 0
          fi

          PUBKEY="$(node -p "require('./src-tauri/tauri.conf.json').plugins.updater.pubkey")"

          # Half a keypair always fails at verification time. Stop before shipping assets.
          if [ -n "${UPDATER_KEY:-}" ] && [ -z "$PUBKEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is set but plugins.updater.pubkey is empty."
            echo "Commit the matching public key to tauri.conf.json, then re-run."
            exit 1
          fi
          if [ -z "${UPDATER_KEY:-}" ] && [ -n "$PUBKEY" ]; then
            echo "plugins.updater.pubkey is set but TAURI_SIGNING_PRIVATE_KEY is missing."
            echo "Existing installs cannot receive a release built without the private key."
            exit 1
          fi

          if [ -n "${UPDATER_KEY:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "extraArgs=--config src-tauri/tauri.release.conf.json" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "extraArgs=" >> "$GITHUB_OUTPUT"
            echo "::warning::No updater signing key; building without auto-update assets (ADR-011)."
          fi

      # Windows code signing (ADR-011 F): Tauri's signCommand calls SSL.com eSigner
      # through scripts/sign-windows.mjs for every binary it signs.
      #
      # The signCommand config is generated here instead of living in the repo because
      # it needs an absolute script path (Tauri runs it from src-tauri), and local and
      # dev builds must not pick it up.
      #
      # staging은 서명하지 않는다. 테스터 빌드에 eSigner 서명 횟수를 쓰지 않는다.
      - name: Resolve Windows code signing
        id: winsign
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET_ENV: ${{ inputs.environment }}
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
          # Pinned so a changed download cannot run with the signing credentials.
          CODESIGNTOOL_URL: https://github.com/SSLcom/CodeSignTool/releases/download/v1.3.2/CodeSignTool-v1.3.2.zip
          CODESIGNTOOL_SHA256: f14b1e1ef14bfa1fd00279c363aab0debbf5dcfba0e4bcdce5d22bb771de0e3a
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:TARGET_ENV -eq 'staging') {
            Add-Content $env:GITHUB_OUTPUT 'enabled=false'
            Write-Host 'staging build: Windows code signing skipped.'
            exit 0
          }

          $names = 'ES_USERNAME', 'ES_PASSWORD', 'ES_CREDENTIAL_ID', 'ES_TOTP_SECRET'
          $missing = @($names | Where-Object { -not [Environment]::GetEnvironmentVariable($_) })
          if ($missing.Count -eq $names.Count) {
            Add-Content $env:GITHUB_OUTPUT 'enabled=false'
            Write-Host '::warning::No eSigner secrets; the Windows installer will be unsigned (ADR-011).'
            exit 0
          }
          # A partial set fails on the first file, after the slow Rust build. Stop now.
          if ($missing.Count -gt 0) {
            Write-Host "Windows signing secrets are incomplete. Missing: $($missing -join ', ')"
            exit 1
          }

          # CodeSignTool's Windows zip bundles a JDK (200MB+). The runner already has one.
          $java = Join-Path "$env:JAVA_HOME_17_X64" 'bin\java.exe'
          if (-not $env:JAVA_HOME_17_X64 -or -not (Test-Path $java)) {
            Write-Host 'JDK 17 (JAVA_HOME_17_X64) not found on the runner; CodeSignTool needs Java 11+.'
            exit 1
          }

          $zip = Join-Path $env:RUNNER_TEMP 'codesigntool.zip'
          Invoke-WebRequest -Uri $env:CODESIGNTOOL_URL -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:CODESIGNTOOL_SHA256) {
            Write-Host "CodeSignTool checksum mismatch: $hash"
            exit 1
          }
          $tool = Join-Path $env:RUNNER_TEMP 'codesigntool'
          Expand-Archive $zip -DestinationPath $tool -Force

          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts\sign-windows.mjs'
          $config = @{ bundle = @{ windows = @{ signCommand = @{ cmd = 'node'; args = @($script, '%1') } } } }
          # Forward slashes: tauri-action splits `args` as a command line.
          $configPath = (Join-Path $env:RUNNER_TEMP 'windows-signing.conf.json') -replace '\\', '/'
          $config | ConvertTo-Json -Depth 6 | Set-Content $configPath -Encoding utf8NoBOM

          Add-Content $env:GITHUB_ENV "CODESIGNTOOL_DIR=$tool"
          Add-Content $env:GITHUB_ENV "CODESIGNTOOL_JAVA=$java"
          Add-Content $env:GITHUB_OUTPUT 'enabled=true'
          Add-Content $env:GITHUB_OUTPUT "extraArgs=--config $configPath"
          Write-Host 'Windows code signing enabled (SSL.com eSigner).'

      # App Store Connect API key is the notarization credential.
      - name: Prepare Apple notarization key
        id: apple-key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          # Signing succeeds without a Team ID; notarization does not. Catch it here
          # instead of after the (slow) universal build.
          if [ -n "${APPLE_CERTIFICATE:-}" ] && [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "APPLE_CERTIFICATE is set but APPLE_TEAM_ID is missing."
            echo "Notarization will fail. The Team ID is the 10-character code in the"
            echo "signing identity: Developer ID Application: NAME (TEAMID)."
            exit 1
          fi
          if [ -z "${APPLE_API_KEY_CONTENT:-}" ]; then
            echo "No APPLE_API_KEY_CONTENT secret; will use Apple ID credentials if they are set."
            exit 0
          fi
          KEY_DIR="$RUNNER_TEMP/apple-api-key"
          KEY_PATH="$KEY_DIR/AuthKey.p8"
          mkdir -p "$KEY_DIR"
          printf '%s' "$APPLE_API_KEY_CONTENT" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          # base64 can decode cleanly and still not be a private key — for instance when
          # the secret holds the wrong file. Check the shape before trusting it.
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_PATH"; then
            echo "APPLE_API_KEY_CONTENT did not decode to a .p8 private key."
            echo "Store the base64 of the AuthKey_*.p8 file downloaded from App Store Connect."
            exit 1
          fi

          for required in APPLE_API_KEY APPLE_API_ISSUER; do
            if [ -z "${!required:-}" ]; then
              echo "$required is missing; notarization with an API key needs it."
              exit 1
            fi
          done

          # Authenticate against Apple before building. Without this the credentials are
          # only exercised after the universal build, so every wrong value costs a full
          # build cycle — we burned two that way.
          echo "Checking notarization credentials..."
          if ! xcrun notarytool history \
            --key "$KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            >/dev/null 2>"$RUNNER_TEMP/notarytool-auth.log"; then
            echo "Apple rejected the notarization credentials:"
            cat "$RUNNER_TEMP/notarytool-auth.log"
            echo
            echo "Check these three in App Store Connect > Users and Access > Integrations:"
            echo "  APPLE_API_KEY         Key ID, 10 characters. It is in the filename: AuthKey_<KEYID>.p8"
            echo "  APPLE_API_ISSUER      Issuer ID, a 36-character UUID. Not the Team ID."
            echo "  APPLE_API_KEY_CONTENT base64 of that same key's .p8 file"
            echo "The key also needs the Developer role or higher to notarize."
            exit 1
          fi
          echo "Notarization credentials accepted."

          echo "path=$KEY_PATH" >> "$GITHUB_OUTPUT"

      - name: Build and upload release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 백엔드 주소는 빌드 시점에 굳는다. 런타임 스위치를 두지 않는 이유는
          # 딥링크 스킴이 설치 시점에 OS에 등록되어 런타임에 못 바꾸기 때문이다 —
          # 주소만 바꾸면 OAuth 콜백이 반대쪽 앱으로 간다.
          VITE_API_BASE_URL: ${{ inputs.environment == 'staging' && 'https://api-staging.standinpose.com' || 'https://api.standinpose.com' }}
          VITE_WEB_BASE_URL: https://standin-seven.vercel.app
          VITE_USE_MOCK_API: "false"
          VITE_USE_MOCK_POSE_API: "false"
          VITE_APP_ENV: ${{ inputs.environment }}
          # ⚠ OS 키체인 서비스 이름. 번들 identifier와 **자동으로 연동되지 않는다**
          #   (secure_store.rs의 SERVICE 상수가 컴파일 타임에 굳는다).
          #
          #   설정하지 않으면 staging 빌드가 프로덕션과 같은 키체인 항목을 쓴다.
          #   그러면 staging 앱이 프로덕션 설치 자격증명을 읽어 staging 서버에 보내
          #   401을 받고(그 installationId는 staging DB에 없다), 자격증명이 있다고
          #   판단해 등록조차 시도하지 않는다. 반대로 staging이 등록에 성공하면 그
          #   항목을 덮어써 **프로덕션 앱이 망가진다.**
          STANDIN_KEYRING_SERVICE: ${{ inputs.environment == 'staging' && 'app.standin.desktop.staging' || 'app.standin.desktop' }}
          # Updater package signing (minisign). Unrelated to OS code signing (ADR-011).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          STANDIN_VERIFY_MACOS_UPDATER: ${{ steps.updater.outputs.enabled }}
          # macOS code signing (ADR-011). Empty on Windows runners by design.
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          # macOS notarization with an App Store Connect API key.
          #
          # APPLE_ID and APPLE_PASSWORD are deliberately absent. An expression that
          # evaluates to '' still DEFINES the variable, and Rust's env::var returns
          # Ok("") for a defined-but-empty variable — so Tauri took the Apple ID path
          # with empty credentials and Apple answered 401 three releases in a row,
          # while the API key credentials were valid the whole time.
          #
          # If the Apple ID fallback is ever needed, put it in a separate step whose
          # `if` skips it entirely rather than blanking the values here.
          APPLE_API_KEY: ${{ steps.apple-key.outputs.path && secrets.APPLE_API_KEY || '' }}
          APPLE_API_ISSUER: ${{ steps.apple-key.outputs.path && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY_PATH: ${{ steps.apple-key.outputs.path }}
          # Tauri needs the Team ID for notarization with either credential, not just
          # the Apple ID fallback. Gating it on the API key being absent left it empty
          # and notarization failed with "Team ID must be at least 3 characters".
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          # Windows code signing (ADR-011 F), read by scripts/sign-windows.mjs.
          # Only passed when the Resolve Windows code signing step enabled it.
          ES_USERNAME: ${{ steps.winsign.outputs.enabled == 'true' && secrets.ES_USERNAME || '' }}
          ES_PASSWORD: ${{ steps.winsign.outputs.enabled == 'true' && secrets.ES_PASSWORD || '' }}
          ES_CREDENTIAL_ID: ${{ steps.winsign.outputs.enabled == 'true' && secrets.ES_CREDENTIAL_ID || '' }}
          ES_TOTP_SECRET: ${{ steps.winsign.outputs.enabled == 'true' && secrets.ES_TOTP_SECRET || '' }}
        with:
          # staging 태그를 분리한다. 같은 태그를 쓰면 staging 빌드가 프로덕션
          # 릴리스에 자산을 얹고, 사용자가 그걸 내려받을 수 있다.
          tagName: v${{ steps.release.outputs.version }}${{ inputs.environment == 'staging' && '-staging' || '' }}
          releaseName: Standin Desktop v${{ steps.release.outputs.version }}${{ inputs.environment == 'staging' && ' (staging)' || '' }}
          releaseBody: ${{ steps.notes.outputs.body }}
          tauriScript: node scripts/tauri-release.mjs
          # staging 빌드는 공개 릴리스로 나가지 않는다.
          # All platforms and updater metadata must pass before publication.
          releaseDraft: true
          # GitHub's releases/latest path skips prereleases, and the updater feed points
          # at it. Marking releases as prerelease means the update never appears (ADR-011).
          # The -beta.N in the version string carries the beta signal instead; publish the
          # draft once the signature checks below have passed.
          #
          # staging은 반대로 **반드시** prerelease여야 한다. draft로 고정해 두긴 했지만,
          # 누군가 "테스터에게 주자"며 그 draft를 publish하는 순간 그것이 releases/latest가
          # 되고 **모든 프로덕션 사용자의 앱이 staging 빌드로 자동 업데이트된다.**
          # prerelease는 releases/latest에서 제외되므로 그 경로를 원천 차단한다.
          prerelease: ${{ inputs.environment == 'staging' }}
          uploadWorkflowArtifacts: true
          # The input is uploadUpdaterJson, not includeUpdaterJson — the action warned
          # "Unexpected input(s) 'includeUpdaterJson'" and fell back to its default of
          # true, so latest.json shipped by luck rather than through the updater gate.
          uploadUpdaterJson: ${{ steps.updater.outputs.enabled }}
          args: ${{ matrix.args }} ${{ steps.updater.outputs.extraArgs }} ${{ steps.winsign.outputs.extraArgs }}

      - name: Verify Windows signature
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SIGNING_ENABLED: ${{ steps.winsign.outputs.enabled }}
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SIGNING_ENABLED -ne 'true') {
            if ($env:TARGET_ENV -eq 'production') {
              throw 'Production releases require Windows code signing.'
            }
            Write-Host ''
            Write-Host 'Windows code signing was not enabled (staging build, or no ES_* secrets), so this build is UNSIGNED.'
            Write-Host 'SmartScreen will show "Unknown publisher". For production, register the ES_* secrets and re-run.'
            exit 0
          }
          $release = 'src-tauri/target/x86_64-pc-windows-msvc/release'
          $installers = @(Get-ChildItem "$release/bundle/nsis" -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer under $release"
          }
          ./scripts/verify-windows-release.ps1 -InstallerPath $installers[0].FullName

      - name: Verify macOS signature
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          BUNDLE="src-tauri/target/universal-apple-darwin/release/bundle"

          APP="$(find "$BUNDLE/macos" -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo "No .app bundle found under $BUNDLE/macos"
            exit 1
          fi
          echo "Bundle: $APP"

          # ADR-011 decision E: one universal binary instead of per-architecture dmgs.
          BIN="$(find "$APP/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)"
          ARCHS="$(lipo -archs "$BIN")"
          echo "Architectures: $ARCHS"
          for arch in arm64 x86_64; do
            case " $ARCHS " in
              *" $arch "*) ;;
              *) echo "Universal build is missing $arch."; exit 1 ;;
            esac
          done

          if [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            if [ "$TARGET_ENV" = production ]; then
              echo "Production releases require macOS signing and notarization."
              exit 1
            fi
            echo
            echo "APPLE_SIGNING_IDENTITY is not set, so this build is UNSIGNED."
            echo "Gatekeeper will block it. Do not hand this release to testers."
            echo "Register the Apple signing secrets, then re-run this workflow."
            exit 0
          fi

          echo "--- codesign ---"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -E 'Authority|TeamIdentifier|flags' || true

          if ! codesign -d --verbose=4 "$APP" 2>&1 | grep -q 'flags=.*runtime'; then
            echo "Hardened Runtime is missing; notarization cannot succeed."
            exit 1
          fi

          echo "--- notarization ---"
          xcrun stapler validate "$APP"

          echo "--- Gatekeeper ---"
          spctl --assess --type execute --verbose=4 "$APP"

          DMG="$(find "$BUNDLE/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          if [ -n "$DMG" ]; then
            echo "--- dmg ---"
            codesign --verify --verbose=2 "$DMG" || echo "note: dmg is not code signed"
            xcrun stapler validate "$DMG" \
              || echo "note: dmg is not stapled; Gatekeeper checks the stapled .app inside on first launch"
          fi

          echo "macOS signing and notarization verified."

  finalize:
    name: Validate updater feed and finalize release
    needs: build
    if: ${{ inputs.environment == 'production' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate all platform entries and attach canonical notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          gh release download "v$VERSION" --pattern latest.json --dir updater-feed
          node scripts/release-notes.mjs --manifest updater-feed/latest.json
          gh release upload "v$VERSION" updater-feed/latest.json --clobber
      - name: Publish verified release
        if: ${{ !inputs.draft }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          gh release edit "v$VERSION" --draft=false --latest
