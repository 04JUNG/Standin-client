name: Build desktop release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis

          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg

          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Require main branch
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Desktop releases must run from the main branch."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Read release version
        id: release
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          node scripts/set-version.mjs "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and upload release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_BASE_URL: https://d1bbz5oaj92efa.cloudfront.net
          VITE_WEB_BASE_URL: https://standin-seven.vercel.app
          VITE_USE_MOCK_API: "false"
          VITE_USE_MOCK_POSE_API: "false"
          VITE_APP_ENV: production
        with:
          tagName: v${{ steps.release.outputs.version }}
          releaseName: Standin Desktop v${{ steps.release.outputs.version }}
          releaseDraft: false
          prerelease: true
          uploadWorkflowArtifacts: true
          args: ${{ matrix.args }}
